name: Daily Cyber Scam Agent

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # Suppresses the Node.js runner migration warning banner
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckduckgo_search groq requests beautifulsoup4

      - name: Run Cyber Threat Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python agent.py

      - name: Commit and push changes
        run: |
          git config --global user.name "ScamWatch-Bot"
          git config --global user.email "bot@github-actions.internal"
          git add scams.json
          git commit -m "Auto-update scam digest: $(date +'%Y-%m-%d')" || exit 0
          git push
