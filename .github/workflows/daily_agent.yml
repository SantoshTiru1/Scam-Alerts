name: Daily Cyber Scam Agent

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (FFmpeg, LibASS & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core libass-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckduckgo_search groq requests beautifulsoup4 edge-tts pillow google-api-python-client google-auth-oauthlib

      - name: Run Cyber Threat Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python agent.py

      - name: Commit and push changes
        run: |
          git config --global user.name "ScamWatch-Bot"
          git config --global user.email "bot@github-actions.internal"
          git add scams.json
          git commit -m "Auto-update scam digest: $(date +'%Y-%m-%d')" || exit 0
          git push
