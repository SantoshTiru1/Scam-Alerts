<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Cyber Scam Daily Watch</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-6xl mx-auto">
    
    <!-- Top Header -->
    <header class="border-b border-slate-800 pb-6 mb-8 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div>
        <div class="flex items-center gap-3">
          <span class="text-3xl">🛡️</span>
          <h1 class="text-2xl md:text-3xl font-extrabold text-cyan-400">Global Cyber Scam Watch</h1>
        </div>
        <p class="text-slate-400 text-sm mt-1">Autonomous daily monitoring across 5 global regions.</p>
      </div>
      <div id="last-updated" class="text-xs text-slate-500 font-mono">
        Checking feed...
      </div>
    </header>

    <!-- Scrollable Timeline -->
    <main id="timeline-container" class="space-y-12">
      <div class="text-slate-500 text-sm animate-pulse">Loading threat reports...</div>
    </main>

  </div>

  <script>
    function formatDateHeader(dateStr) {
      if (!dateStr) return "Today";
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const parts = dateStr.split("-");
      if (parts.length === 3) {
        const year = parts[0];
        const monthIndex = parseInt(parts[1], 10) - 1;
        const day = parts[2].padStart(2, "0");
        return `${day}-${months[monthIndex]}-${year}`;
      }
      return dateStr;
    }

    async function loadFeed() {
      const container = document.getElementById('timeline-container');
      try {
        const res = await fetch('./scams.json?nocache=' + Date.now());
        if (!res.ok) throw new Error("File not found");
        const data = await res.json();
        
        document.getElementById('last-updated').innerText = "Last Updated: " + (data.updated_at || "Recent");

        // Backward compatibility fallback:
        let history = [];
        if (Array.isArray(data.history) && data.history.length > 0) {
          history = data.history;
        } else if (data.regions) {
          history = [{ date: "2026-10-02", regions: data.regions }];
        }

        if (history.length === 0) {
          container.innerHTML = '<p class="text-slate-400 text-sm">No scam reports recorded yet.</p>';
          return;
        }

        container.innerHTML = '';

        history.forEach((dayData, index) => {
          const formattedDate = formatDateHeader(dayData.date);
          const isLatest = index === 0;

          const daySection = document.createElement('section');
          daySection.className = "border-b border-slate-900 pb-10 last:border-b-0";

          let dateHeaderHtml = `
            <div class="flex items-center gap-3 mb-6">
              <span class="h-3 w-3 rounded-full ${isLatest ? 'bg-cyan-400 animate-pulse' : 'bg-slate-600'}"></span>
              <h2 class="text-xl md:text-2xl font-black tracking-wide text-slate-100 font-mono">
                ${formattedDate}
              </h2>
              ${isLatest ? '<span class="text-[10px] font-bold tracking-wider uppercase bg-cyan-950 text-cyan-400 border border-cyan-800/80 px-2 py-0.5 rounded">Latest</span>' : ''}
              <div class="flex-1 h-[1px] bg-slate-800 ml-2"></div>
            </div>
          `;

          let cardsHtml = '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">';
          for (const [region, info] of Object.entries(dayData.regions || {})) {
            cardsHtml += `
              <div class="bg-slate-900 border border-slate-800 hover:border-slate-700 transition rounded-xl p-5 shadow flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between mb-3">
                    <span class="text-xs font-bold uppercase tracking-wider bg-cyan-950/80 text-cyan-400 px-2.5 py-1 rounded border border-cyan-800/60">
                      ${region}
                    </span>
                  </div>
                  <h3 class="text-base font-semibold text-slate-100 mb-2 leading-snug">${info.headline || region + ' Alert'}</h3>
                  <p class="text-slate-300 text-sm leading-relaxed whitespace-pre-line">${info.summary || 'Summary unavailable.'}</p>
                </div>
                ${info.source ? `
                  <a href="${info.source}" target="_blank" rel="noopener noreferrer" 
                     class="mt-4 inline-flex items-center gap-1.5 text-xs font-medium text-cyan-400 hover:text-cyan-300 hover:underline">
                    Read primary report <span>&rarr;</span>
                  </a>` : ''}
              </div>
            `;
          }
          cardsHtml += '</div>';

          daySection.innerHTML = dateHeaderHtml + cardsHtml;
          container.appendChild(daySection);
        });

      } catch (err) {
        container.innerHTML = `
          <div class="p-4 bg-slate-900 border border-slate-800 rounded-lg text-slate-400 text-sm">
            Failed to load reports. Trigger the workflow under the GitHub Actions tab.
          </div>`;
      }
    }

    loadFeed();
  </script>
</body>
</html>
